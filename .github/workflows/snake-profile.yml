name: Generate Contribution Snake Animation

on:
  schedule:
    # Uruchomienie codziennie o 00:00 UTC (idempotentny job wsadowy)
    - cron: "0 0 * * *"
  workflow_dispatch: # Możliwość ręcznego wyzwolenia pipeline'u

# Zasada najmniejszych uprawnień (Least Privilege)
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
